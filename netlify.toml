[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Guides renamed to Resources
[[redirects]]
  from = "/guides/*"
  to = "/resources/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/guides"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/resources"
  to = "/resources/"
  status = 301

# Legacy prototype — keep offline; live Quote tool is /quote/
[[redirects]]
  from = "/instant-quote-form.html"
  to = "/quote/"
  status = 301
  force = true

[[redirects]]
  from = "/instant-quote-form"
  to = "/quote/"
  status = 301
  force = true

